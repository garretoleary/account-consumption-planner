<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
  <title id="title">Account Consumption Planner overview</title>
  <desc id="description">A comparison of the old forecasting process with the Account Consumption Planner process, shown as two columns of four steps.</desc>

  <rect width="1200" height="940" fill="#ffffff"/>

  <text x="300" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#991b1b">The old way</text>
  <text x="900" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#166534">With the planner</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" text-anchor="middle">
    <rect x="60" y="100" width="480" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="300" y="160" fill="#7f1d1d">
      <tspan x="300" dy="0">Usage sits in a</tspan>
      <tspan x="300" dy="34">spreadsheet.</tspan>
    </text>

    <rect x="60" y="310" width="480" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="300" y="370" fill="#7f1d1d">
      <tspan x="300" dy="0">The forecast is a</tspan>
      <tspan x="300" dy="34">trend line.</tspan>
    </text>

    <rect x="60" y="520" width="480" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="300" y="580" fill="#7f1d1d">
      <tspan x="300" dy="0">Growth is counted before</tspan>
      <tspan x="300" dy="34">the customer agrees.</tspan>
    </text>

    <rect x="60" y="730" width="480" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="300" y="790" fill="#7f1d1d">
      <tspan x="300" dy="0">The number misses and</tspan>
      <tspan x="300" dy="34">nobody knows why.</tspan>
    </text>

    <rect x="660" y="100" width="480" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="900" y="160" fill="#14532d">
      <tspan x="900" dy="0">Usage, seats and stages</tspan>
      <tspan x="900" dy="34">are read every run.</tspan>
    </text>

    <rect x="660" y="310" width="480" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="900" y="370" fill="#14532d">
      <tspan x="900" dy="0">Value is marked proposed,</tspan>
      <tspan x="900" dy="34">agreed or proven.</tspan>
    </text>

    <rect x="660" y="520" width="480" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="900" y="580" fill="#14532d">
      <tspan x="900" dy="0">Only agreed value moves</tspan>
      <tspan x="900" dy="34">the forecast.</tspan>
    </text>

    <rect x="660" y="730" width="480" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <text x="900" y="790" fill="#14532d">
      <tspan x="900" dy="0">A person reviews every</tspan>
      <tspan x="900" dy="34">plan and brief.</tspan>
    </text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
    <path d="M300 252 V286" stroke="#dc2626"/>
    <path d="M286 275 L300 289 L314 275" stroke="#dc2626"/>
    <path d="M300 462 V496" stroke="#dc2626"/>
    <path d="M286 485 L300 499 L314 485" stroke="#dc2626"/>
    <path d="M300 672 V706" stroke="#dc2626"/>
    <path d="M286 695 L300 709 L314 695" stroke="#dc2626"/>

    <path d="M900 252 V286" stroke="#16a34a"/>
    <path d="M886 275 L900 289 L914 275" stroke="#16a34a"/>
    <path d="M900 462 V496" stroke="#16a34a"/>
    <path d="M886 485 L900 499 L914 485" stroke="#16a34a"/>
    <path d="M900 672 V706" stroke="#16a34a"/>
    <path d="M886 695 L900 709 L914 695" stroke="#16a34a"/>
  </g>
</svg>
